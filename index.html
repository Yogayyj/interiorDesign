<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>空间灵感 · 图片收藏馆</title>
<style>
:root{color-scheme:light;--ink:#292d28;--muted:#777c72;--paper:#f6f5f0;--line:#ddded5;--green:#455744}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,sans-serif}button,label.import{cursor:pointer;font:inherit}button:focus-visible,label:focus-within{outline:3px solid #b58d58;outline-offset:4px}header{padding:36px 6vw 22px;border-bottom:1px solid var(--line)}.brand{font-size:12px;letter-spacing:3px;color:var(--green)}h1{font-family:Georgia,serif;font-size:clamp(32px,5vw,58px);font-weight:400;line-height:1.2;margin:22px 0 12px}p{color:var(--muted)}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}button,.import{border:1px solid var(--line);background:transparent;padding:9px 17px;border-radius:30px;color:var(--ink)}button.active,.import{background:var(--green);color:white;border-color:var(--green)}.import input{position:absolute;width:1px;height:1px;opacity:0}.spacer{flex:1}.view-switch{display:flex;gap:7px}main{padding:28px 6vw 70px}.status{font-size:13px;color:var(--muted);margin-bottom:22px}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 22px}.card{margin:0;min-width:0}.picture{position:relative;background:#e8e9e1;border-radius:5px;overflow:hidden}.picture img{display:block;width:100%;height:310px;object-fit:cover;cursor:zoom-in}.favorite{position:absolute;right:12px;top:12px;background:#fffffff0;border:0;padding:7px 13px;color:#333}.favorite[aria-pressed=true]{background:var(--green);color:white}figcaption{padding:11px 2px;font-size:13px;overflow-wrap:anywhere}.gallery.scroll{display:flex;flex-direction:column;align-items:center;gap:40px}.scroll .card{width:min(100%,1000px)}.scroll .picture img{height:auto;max-height:80vh;object-fit:contain}.empty{text-align:center;padding:80px 20px;border:1px dashed var(--line);border-radius:10px}.empty h2{font-weight:400;font-size:25px}.empty p{max-width:510px;margin:12px auto}dialog{border:0;padding:0;background:#161915;color:white;width:94vw;max-width:1400px;max-height:95vh}dialog::backdrop{background:#000c}.modalbar{display:flex;justify-content:space-between;align-items:center;padding:12px;gap:10px}.modalbar button{color:white}dialog img{display:block;width:100%;height:75vh;object-fit:contain}.hint{font-size:12px;margin-top:20px}@media(max-width:900px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){header{padding-top:24px}.gallery{grid-template-columns:1fr}.picture img{height:340px}.spacer{display:none}.view-switch{width:100%}main{padding-top:20px}}
</style>
</head>
<body>
<header><div class="brand">INTERIOR / INSPIRATION</div><h1>发现空间，收藏喜欢。</h1><p>把让你心动的设计，留在自己的灵感集合里。</p>
<div class="toolbar"><button id="all" class="active" aria-pressed="true">全部图片 <span id="allCount">0</span></button><button id="liked" aria-pressed="false">我的收藏 <span id="likedCount">0</span></button><span class="spacer"></span><label class="import">添加图片<input id="files" type="file" accept="image/*" multiple></label><label class="import">选择文件夹<input id="folder" type="file" webkitdirectory multiple></label><div class="view-switch"><button id="grid" class="active" aria-pressed="true">网格概览</button><button id="scroll" aria-pressed="false">滚动浏览</button></div></div></header>
<main><div id="status" class="status" role="status" aria-live="polite"></div><div id="gallery" class="gallery"></div><p class="hint">收藏保存在当前浏览器中。本地图片仅在当前页面读取，不会上传；刷新后需重新选择原文件夹。</p></main>
<dialog id="viewer"><div class="modalbar"><button id="prev" aria-label="上一张">←</button><span id="viewerTitle"></span><button id="modalFavorite">收藏</button><button id="next" aria-label="下一张">→</button><button id="close" aria-label="关闭大图">关闭 ×</button></div><img id="large" alt=""></dialog>
<script>
const $=id=>document.getElementById(id);const storageKey='interior-favorites-v1';let favorites=new Set(),items=[],section='all',mode='grid',currentId=null,storageError=false;try{favorites=new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch{};
const visible=()=>items.filter(item=>section==='all'||favorites.has(item.id));
function save(){try{localStorage.setItem(storageKey,JSON.stringify([...favorites]));storageError=false}catch{storageError=true}}
function toggle(id){favorites.has(id)?favorites.delete(id):favorites.add(id);save();render();if($('viewer').open)updateViewer()}
function render(){const list=visible();$('allCount').textContent=items.length;$('likedCount').textContent=items.filter(i=>favorites.has(i.id)).length;$('all').classList.toggle('active',section==='all');$('liked').classList.toggle('active',section==='liked');for(const id of ['all','liked'])$(id).setAttribute('aria-pressed',String(section===id));for(const id of ['grid','scroll']){$(id).classList.toggle('active',mode===id);$(id).setAttribute('aria-pressed',String(mode===id))}$('gallery').className='gallery '+(mode==='scroll'?'scroll':'');$('status').textContent=`${section==='all'?'全部图片':'我的收藏'} · ${list.length} 张${storageError?' · 浏览器无法保存收藏，当前收藏仅在本次页面中有效':''}`;$('gallery').replaceChildren();if(!list.length){const box=document.createElement('div');box.className='empty';box.style.gridColumn='1 / -1';const h=document.createElement('h2');h.textContent=section==='liked'?'为喜欢的空间留个位置':'你的灵感馆，等待第一张图片';const p=document.createElement('p');p.textContent=section==='liked'?'点击图片右上角的「♡ 收藏」，在这里查看喜欢的图片。':'点击上方添加图片或选择文件夹。仓库图片可通过扫描脚本加入概览。';box.append(h,p);$('gallery').append(box);return}for(const item of list){const card=document.createElement('figure');card.className='card';const picture=document.createElement('div');picture.className='picture';const img=document.createElement('img');img.src=item.src;img.alt=item.name;img.loading='lazy';img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','查看大图：'+item.name);img.onclick=()=>openViewer(item.id);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openViewer(item.id)}};img.onerror=()=>{img.alt='无法加载图片：'+item.name};const button=document.createElement('button');button.className='favorite';button.textContent=favorites.has(item.id)?'♥ 已收藏':'♡ 收藏';button.setAttribute('aria-pressed',String(favorites.has(item.id)));button.setAttribute('aria-label',`${favorites.has(item.id)?'取消收藏':'收藏'} ${item.name}`);button.onclick=()=>toggle(item.id);const caption=document.createElement('figcaption');caption.textContent=item.name;picture.append(img,button);card.append(picture,caption);$('gallery').append(card)}}
function openViewer(id){currentId=id;updateViewer();$('viewer').showModal()}
function updateViewer(){const item=items.find(i=>i.id===currentId);if(!item)return;$('large').src=item.src;$('large').alt=item.name;$('viewerTitle').textContent=item.name;$('modalFavorite').textContent=favorites.has(item.id)?'♥ 已收藏':'♡ 收藏';$('modalFavorite').setAttribute('aria-pressed',String(favorites.has(item.id)))}
function move(delta){const list=visible();if(!list.length){$('viewer').close();return}const index=list.findIndex(i=>i.id===currentId);currentId=list[(index+delta+list.length)%list.length].id;updateViewer()}
function addFiles(files){for(const file of files){if(!file.type.startsWith('image/')&&!/\.(avif|bmp|gif|jpe?g|png|svg|webp)$/i.test(file.name))continue;const path=file.webkitRelativePath||file.name;const id='local:'+path+':'+file.size+':'+file.lastModified;if(items.some(i=>i.id===id))continue;items.push({id,name:path,src:URL.createObjectURL(file)})}render()}
$('files').onchange=e=>addFiles(e.target.files);$('folder').onchange=e=>addFiles(e.target.files);for(const id of ['all','liked'])$(id).onclick=()=>{section=id;render()};for(const id of ['grid','scroll'])$(id).onclick=()=>{mode=id;render()};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('close').onclick=()=>$('viewer').close();$('modalFavorite').onclick=()=>toggle(currentId);document.addEventListener('keydown',e=>{if($('viewer').open&&e.key==='ArrowLeft')move(-1);if($('viewer').open&&e.key==='ArrowRight')move(1)});
async function load(){try{const response=await fetch('./images.json');if(response.ok){const paths=await response.json();for(const path of paths){if(typeof path!=='string')continue;items.push({id:'repo:'+path,name:path,src:path.split('/').map(encodeURIComponent).join('/')})}}}catch{}render()}render();load();
</script>
</body></html>
